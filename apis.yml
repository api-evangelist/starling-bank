name: Starling Bank
kind: company
description: Starling Bank is a UK app-only digital challenger bank founded in 2014 by
  Anne Boden and headquartered in London, holding a full UK banking licence and authorised
  and regulated by the Prudential Regulation Authority and the Financial Conduct Authority
  (FSCS-protected, SWIFT SRLGGB2L). It is a privately held company - not a mutual and not
  publicly listed - backed by investors including Goldman Sachs, Fidelity, and the Qatar
  Investment Authority, and it also licenses its core banking platform as Software-as-a-Service
  under the "Engine by Starling" brand. As an FCA-authorised ASPSP it participates in UK
  Open Banking / PSD2, but Starling is best known for its own developer-friendly, bespoke
  RESTful Developer API (accounts, transaction feed, payments, payees, savings goals/spaces,
  cards, mandates, and identity) served over OAuth2 at api.starlingbank.com with a full
  sandbox, alongside its Open Banking Read/Write (AIS, PIS, CBPII) conformance to the Open
  Banking Implementation Entity (OBIE) standard secured with FAPI-grade OAuth2/OIDC, mutual-TLS,
  and PSD2 strong customer authentication. Starling is a challenger bank and is not one of the
  nine CMA9 mandated banks.
