- aid: starling-bank:starling-open-data-api
  name: Starling Open Data API (OBIE Standard)
  description: UK Open Banking Open Data API - PUBLIC, unauthenticated reference data
    (personal and business current accounts, and, for banks with a physical estate, ATMs
    and branches) modelled on the OBIE Open Data standard. Starling is an app-only bank
    with no branches or ATM estate; no live Open Data endpoint was confirmed for Starling
    during this review, so the harvested specification is the shared OBIE standard, not
    a Starling contract.
  humanURL: https://developer.starlingbank.com/docs/open-banking
  baseURL: https://api.starlingbank.com/open-banking
  tags:
  - Open Data
  - Reference Data
  properties:
  - type: OpenAPI
    url: openapi/obie-opendata-swagger.json
  - type: Documentation
    url: https://developer.starlingbank.com/docs/open-banking
  - type: APIReference
    url: https://github.com/OpenBankingUK/opendata-api-spec-compiled
- aid: starling-bank:starling-account-transaction-api
  name: Starling Account and Transaction Information API (AIS, OBIE Read/Write)
  description: UK Open Banking Read/Write Account and Transaction Information (AIS) API
    for accessing account, balance, transaction, and product data as an FCA-authorised
    ASPSP, conformant to the OBIE Read/Write standard and secured with FAPI OAuth2/OIDC,
    mutual-TLS, and PSD2 strong customer authentication. Base path shown is the OBIE
    standard shape and was not publicly confirmed for Starling.
  humanURL: https://developer.starlingbank.com/docs/open-banking
  baseURL: https://api.starlingbank.com/open-banking/v3.1/aisp
